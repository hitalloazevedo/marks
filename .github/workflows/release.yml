# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"   # dispara quando você criar uma tag como v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: |
          GOOS=linux   GOARCH=amd64  go build -o marks-linux-amd64  .
          GOOS=darwin  GOARCH=amd64  go build -o marks-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64  go build -o marks-darwin-arm64 .
          GOOS=windows GOARCH=amd64  go build -o marks-windows-amd64.exe .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: marks-*
